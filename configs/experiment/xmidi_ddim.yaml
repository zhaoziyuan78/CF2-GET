# @package _global_
defaults:
  - xmidi_cfm
  - override /transport: ddim
  - _self_
experiment:
  name: xmidi_ddim
transport:
  model: {hidden_dim: 768, layers: 10, heads: 12, latent_tokens: 128, slot_identity: true}
  conditioning: {embedding_dim: 768}
  classifier_free_guidance: false
  condition_dropout: 0.0
  prediction_guidance_scale: 1.0
  source_repulsion_scale: 0.0
  roundtrip: {enabled: false, weight: 0.0}
  ddim_inversion: {method: vanilla, iterations: 5, tolerance: 1.0e-5, stop_on_convergence: true}
  training: {warmup_steps: 1500}
